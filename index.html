<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới 2026</title>
    <style>
        /* Thiết lập mặc định cho toàn trang */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        body.show-wish-bg {
            background-image: url('image_cf08e4.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        .container {
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
            box-sizing: border-box;
        }

        #input-page {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: block;
        }

        #wish-page {
            display: none;
            background: rgba(139, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 3px solid #ffd700;
            box-shadow: 0 0 50px rgba(0,0,0,0.7);
            max-height: 90vh; /* Không cho khung vượt quá 90% chiều cao màn hình */
            overflow: hidden;
            display: none; /* Sẽ đổi thành flex trong JS */
            flex-direction: column;
        }

        h1 { color: #d63031; margin-bottom: 20px; font-size: 1.5rem; }
        #wish-page h1 { color: #ffd700; text-shadow: 2px 2px 5px #000; }

        input {
            width: 80%; padding: 15px; margin-bottom: 20px;
            border: 2px solid #fab1a0; border-radius: 30px;
            font-size: 1.1rem; text-align: center; outline: none;
        }

        button {
            padding: 15px 40px; background: #d63031;
            color: white; border: none; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); background: #ff7675; }

        /* Vùng chứa lời chúc có thanh cuộn */
        #wish-content {
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: #fff;
            padding: 15px; 
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px; 
            margin: 10px 0;
            white-space: pre-wrap;
            text-align: left; /* Căn lề trái cho dễ đọc văn bản dài */
            overflow-y: auto; /* Tự động hiện thanh cuộn khi chữ quá dài */
            max-height: 55vh; /* Chiều cao tối đa của vùng văn bản */
        }

        /* Tùy chỉnh thanh cuộn cho đẹp */
        #wish-content::-webkit-scrollbar { width: 8px; }
        #wish-content::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

        /* CSS cho icon chim cánh cụt */
        .pg-icon {
            width: 30px;
            height: auto;
            vertical-align: middle;
            margin: 0 5px;
        }

        .btn-back { background: #fff; color: #333; font-size: 0.8rem; margin-top: 10px; padding: 8px 20px; cursor: pointer; border-radius: 20px; border: none; }
        
        .confetti {
            position: absolute; width: 10px; height: 10px; top: -10px;
            z-index: 100; animation: fall 3s linear infinite;
        }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>

            confetti.style.left = Math.random() * 100 + "vw";
            const colors = ["#ffd700", "#ffffff", "#ff4757", "#2ed573", "#ffa502"];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
